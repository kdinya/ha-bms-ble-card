name: Beta release

on:
  push:
    branches:
      - bms-v3-auto-discovery

permissions:
  contents: write

jobs:
  beta-release:
    if: startsWith(github.event.head_commit.message, 'release-beta:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bms-v3-auto-discovery

      - name: Create next beta tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest=$(git tag --list 'v3.0.0-beta.*' | sort -V | tail -n1 || true)
          if [ -z "$latest" ]; then next=1; else next=$(( ${latest##*.} + 1 )); fi
          tag="v3.0.0-beta.${next}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Release $tag"
          git push origin "$tag"

      - name: Validate HACS entry point
        shell: bash
        run: |
          set -euo pipefail
          test -s ha-bms-ble-card.js
          node --check ha-bms-ble-card.js

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp ha-bms-ble-card.js release/ha-bms-ble-card.js
          sed -i -E 's/(const VERSION = ")[^"]+(";)/\1'"${{ steps.tag.outputs.tag }}"'\2/' release/ha-bms-ble-card.js
          node --check release/ha-bms-ble-card.js
          test -s release/ha-bms-ble-card.js
          grep -F 'const VERSION = "${{ steps.tag.outputs.tag }}"' release/ha-bms-ble-card.js

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: release/ha-bms-ble-card.js
          generate_release_notes: true
