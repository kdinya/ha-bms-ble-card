name: Gemini Code Assistant

on:
  issues:
    types: [opened]

jobs:
  process-issue:
    if: contains(github.event.issue.title, '[AI]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-genai

      - name: Run Gemini Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 << 'EOF'
          import os, glob, sys
          from google import genai

          api_key = os.environ.get('GEMINI_API_KEY')
          if not api_key:
              print('ПОМИЛКА: Секрет GEMINI_API_KEY порожній або відсутній у Secrets!')
              sys.exit(1)

          client = genai.Client(api_key=api_key)

          # Збираємо файли проєкту
          code_files = glob.glob('**/*.js', recursive=True) + glob.glob('**/*.css', recursive=True) + glob.glob('**/*.html', recursive=True) + glob.glob('**/*.json', recursive=True)
          context = ''
          for filepath in code_files:
              if 'node_modules' in filepath or '.git' in filepath:
                  continue
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      context += f'\n--- FILE: {filepath} ---\n' + f.read()
              except Exception as e:
                  print(f'Пропущено файл {filepath}: {e}')

          title = os.environ.get('ISSUE_TITLE', '')
          body = os.environ.get('ISSUE_BODY', '')

          prompt = f"""
          Task: {title}
          Details: {body}

          Existing Codebase:
          {context}

          Return ONLY the complete updated code for the file that requires modification.
          Precede the code block with a line specifying the relative file path in this exact format:
          FILENAME: path/to/file
          """

          try:
              response = client.models.generate_content(
                  model='gemini-3.6-flash',
                  contents=prompt
              )
              text = response.text.strip()
              print('Відповідь від Gemini отримано успішно.')

              if 'FILENAME:' in text:
                  lines = text.splitlines()
                  filepath = lines[0].replace('FILENAME:', '').strip()
                  code = '\n'.join(lines[1:]).strip()
                  if code.startswith('```'):
                      code = '\n'.join(code.splitlines()[1:])
                  if code.endswith('```'):
                      code = '\n'.join(code.splitlines()[:-1])

                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write(code)
                  print(f'Файл успішно оновлено: {filepath}')
              else:
                  print('У відповіді Gemini відсутній заголовок FILENAME.')
          except Exception as e:
              print(f'Помилка Gemini API: {e}')
              sys.exit(1)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Gemini Assistant"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "AI Fix: ${{ github.event.issue.title }}" || exit 0
          git push
          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          
          code_files = glob.glob('**/*.js', recursive=True) + glob.glob('**/*.css', recursive=True) + glob.glob('**/*.html', recursive=True)
          context = ''
          for filepath in code_files:
              with open(filepath, 'r', encoding='utf-8') as f:
                  context += f'\n--- FILE: {filepath} ---\n' + f.read()

          prompt = f'''
          Task: {os.environ['ISSUE_TITLE']}
          Details: {os.environ['ISSUE_BODY']}
          
          Existing Codebase:
          {context}

          Return ONLY the complete updated code for the file that requires modification.
          Precede the code block with a line specifying the relative file path in this exact format:
          FILENAME: path/to/file
          '''

          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=prompt
          )

          text = response.text.strip()
          if 'FILENAME:' in text:
              lines = text.splitlines()
              filepath = lines[0].replace('FILENAME:', '').strip()
              code = '\n'.join(lines[1:]).strip()
              if code.startswith('```'):
                  code = '\n'.join(code.splitlines()[1:])
              if code.endswith('```'):
                  code = '\n'.join(code.splitlines()[:-1])
                  
              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(code)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Gemini Assistant"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "AI Fix: ${{ github.event.issue.title }}" || exit 0
          git push
          
