name: Tests

on:
  push:
    branches: [main, bms-v3-auto-discovery]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check stable card
        run: node --check src/ha-bms-ble-card.js
      - name: Syntax check v3 card
        run: node --check src/ha-bms-ble-card-v3.js
      - name: Run unit tests
        run: node --test test/logic.test.js test/smoke-render.test.js test/v3-discovery.test.js
