name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build card artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src/ha-bms-ble-card-v3.js dist/ha-bms-ble-card.js
          node --check dist/ha-bms-ble-card.js

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ha-bms-ble-card.js
          generate_release_notes: true
